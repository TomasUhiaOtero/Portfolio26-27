# Configuración de despliegue.
#
# La aplicación vive en el subdirectorio `web/`, así que hay que indicar la
# carpeta base explícitamente. Si en el panel de Netlify ya había valores
# puestos a mano, este archivo tiene prioridad sobre ellos.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA de una sola página: cualquier ruta desconocida sirve el index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las imágenes de proyecto no llevan hash, pero cambian muy poco.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
